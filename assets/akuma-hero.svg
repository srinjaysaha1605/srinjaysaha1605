<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">AKUMA system profile</title>
  <desc id="desc">A dark terminal-style introduction for Srinjay Saha, AI and full-stack developer.</desc>
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="0.16" stop-color="#00e5ff" stop-opacity="0.75"/>
      <stop offset="0.84" stop-color="#00e5ff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="1200" height="420" fill="#07090b"/>
  <rect width="1200" height="420" fill="url(#grid)"/>
  <rect x="30" y="28" width="1140" height="364" rx="2" fill="none" stroke="#ffffff" stroke-opacity="0.18"/>
  <path d="M30 76H1170" stroke="#ffffff" stroke-opacity="0.18"/>
  <circle cx="58" cy="52" r="5" fill="#00e5ff"/>
  <circle cx="78" cy="52" r="5" fill="#ffffff" fill-opacity="0.3"/>
  <circle cx="98" cy="52" r="5" fill="#ffffff" fill-opacity="0.16"/>
  <g fill="#aab4bc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.6">
    <text x="124" y="57">AKUMA.OS / PROFILE</text>
    <text x="75" y="121" fill="#00e5ff">$ boot developer_profile --identity</text>
    <text x="75" y="151">[OK]  identity .............. loaded</text>
    <text x="75" y="176">[OK]  projects .............. indexed</text>
    <text x="75" y="201">[OK]  system ................ online</text>
  </g>
  <g text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="810" y="174" fill="#f4f7f8" font-size="62" font-weight="700" letter-spacing="13">AKUMA</text>
    <text x="810" y="210" fill="#aab4bc" font-size="15" letter-spacing="4">SRINJAY SAHA</text>
    <path d="M601 235H1019" stroke="url(#fade)"/>
    <text x="810" y="273" fill="#f4f7f8" font-size="16" letter-spacing="2">AI &amp; FULL-STACK DEVELOPER</text>
    <text x="810" y="309" fill="#00e5ff" font-size="16" letter-spacing="2.5">BUILD. BREAK. REBUILD.</text>
  </g>
  <g fill="#aab4bc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.3">
    <text x="75" y="347">STATUS  <tspan fill="#00e5ff">ONLINE</tspan></text>
    <text x="75" y="370">FOCUS   AI × WEB × SYSTEMS</text>
    <text x="900" y="370">v1.0.0</text>
